<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="tForkliftTruck"><title id="tForkliftTruck">Warehouse forklift carrying a crate</title>
<g stroke="#14161C" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
  <ellipse cx="200" cy="330" rx="150" ry="36" fill="#8DB0F4" opacity="0.18" stroke="none"/>

  <!-- far-side wheel peeking behind the body -->
  <ellipse cx="118" cy="248" rx="22" ry="14" fill="#2A2F3D"/>
  <ellipse cx="118" cy="248" rx="12" ry="7" fill="#3D4354"/>

  <!-- counterweight block at the rear (left) -->
  <path d="M62 224 L96 204 L130 224 L96 244 Z" fill="#F7D46B"/>
  <path d="M130 224 L130 264 L96 284 L96 244 Z" fill="#F5C544"/>
  <path d="M62 224 L62 264 L96 284 L96 244 Z" fill="#DFA92C"/>

  <!-- main yellow body volume -->
  <path d="M96 204 L182 154 L250 194 L164 244 Z" fill="#F7D46B"/>
  <path d="M250 194 L250 234 L164 284 L164 244 Z" fill="#F5C544"/>
  <path d="M96 204 L164 244 L164 284 L96 244 Z" fill="#DFA92C"/>
  <path d="M208 210 L208 250" opacity="0.45"/>

  <!-- operator step recess line -->
  <path d="M164 264 L250 214" opacity="0.45"/>

  <!-- blue seat : base + backrest -->
  <path d="M124 200 L152 184 L176 198 L148 214 Z" fill="#B9CFF9"/>
  <path d="M176 198 L176 212 L148 228 L148 214 Z" fill="#8DB0F4"/>
  <path d="M124 200 L148 214 L148 228 L124 214 Z" fill="#6D97E8"/>
  <path d="M110 192 L124 184 L124 156 L110 164 Z" fill="#6D97E8"/>
  <path d="M124 184 L152 168 L152 140 L124 156 Z" fill="#8DB0F4"/>
  <path d="M110 164 L124 156 L152 140 L138 132 Z" fill="#B9CFF9"/>

  <!-- overhead guard : 4 posts -->
  <path d="M100 200 L100 92" />
  <path d="M164 240 L164 132" />
  <path d="M182 150 L182 42" />
  <path d="M246 190 L246 82" />

  <!-- overhead guard : flat roof (top rhombus + thin near edge) -->
  <path d="M96 92 L182 42 L250 82 L164 132 Z" fill="#3D4354"/>
  <path d="M250 82 L250 90 L164 140 L164 132 Z" fill="#14161C"/>
  <path d="M96 92 L96 100 L164 140 L164 132 Z" fill="#2A2F3D"/>
  <path d="M139 67 L207 107" opacity="0.45"/>

  <!-- mast : vertical rails rising in front of the body -->
  <path d="M250 194 L266 184 L266 68 L250 78 Z" fill="#3D4354"/>
  <path d="M250 78 L266 68 L282 78 L266 88 Z" fill="#DCE7FD"/>
  <path d="M266 184 L282 174 L282 58 L266 68 Z" fill="#2A2F3D"/>
  <path d="M258 190 L258 74" opacity="0.45"/>
  <path d="M274 180 L274 64" opacity="0.45"/>

  <!-- carriage plate on the mast -->
  <path d="M254 170 L286 152 L286 176 L254 194 Z" fill="#3D4354"/>

  <!-- forks : two prongs reaching forward-right -->
  <path d="M278 186 L336 220 L336 228 L278 194 Z" fill="#3D4354"/>
  <path d="M264 194 L322 228 L322 236 L264 202 Z" fill="#2A2F3D"/>

  <!-- pallet : two dark horizontal slats resting on the forks -->
  <path d="M262 186 L320 152 L346 167 L288 201 Z" fill="#3D4354"/>
  <path d="M346 167 L346 177 L288 211 L288 201 Z" fill="#14161C"/>
  <path d="M262 186 L288 201 L288 211 L262 196 Z" fill="#2A2F3D"/>
  <path d="M272 168 L272 190" />
  <path d="M304 176 L304 198" />
  <path d="M336 161 L336 183" />

  <!-- blue crate on the pallet -->
  <path d="M304 118 L338 138 L304 158 L270 138 Z" fill="#B9CFF9"/>
  <path d="M338 138 L338 168 L304 188 L304 158 Z" fill="#8DB0F4"/>
  <path d="M270 138 L270 168 L304 188 L304 158 Z" fill="#6D97E8"/>
  <path d="M321 128 L321 178" opacity="0.45"/>

  <!-- near wheels : rear drive + front steer -->
  <ellipse cx="112" cy="284" rx="26" ry="16" fill="#2A2F3D"/>
  <ellipse cx="112" cy="284" rx="14" ry="9" fill="#3D4354"/>
  <ellipse cx="112" cy="284" rx="5" ry="3" fill="#DCE7FD"/>

  <ellipse cx="212" cy="284" rx="22" ry="14" fill="#2A2F3D"/>
  <ellipse cx="212" cy="284" rx="12" ry="7" fill="#3D4354"/>
  <ellipse cx="212" cy="284" rx="5" ry="3" fill="#DCE7FD"/>

  <!-- warning beacon on the roof -->
  <ellipse cx="182" cy="42" rx="8" ry="5" fill="#F5C544"/>
  <path d="M174 42 L174 34 L190 34 L190 42" fill="#F7D46B"/>
</g>
</svg>
