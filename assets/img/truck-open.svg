<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" role="img" aria-labelledby="tOpenTruck"><title id="tOpenTruck">Open body goods truck</title>
<g stroke="#14161C" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
  <ellipse cx="278" cy="332" rx="212" ry="42" fill="#8DB0F4" opacity="0.18" stroke="none"/>

  <!-- far-side wheel peeking (behind chassis) -->
