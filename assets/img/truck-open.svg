  <path d="M392 176 L392 206 L228 300 L228 270 Z" fill="#DCE7FD"/>
  <path d="M132 214 L132 244 L228 300 L228 270 Z" fill="#3D4354"/>
  <path d="M392 176 L392 206" opacity="0.45"/>

  <!-- crate 1 : yellow, rear of deck -->
  <path d="M186 200 L220 220 L186 240 L152 220 Z" fill="#F7D46B"/>
  <path d="M220 220 L220 250 L186 270 L186 240 Z" fill="#F5C544"/>
  <path d="M152 220 L152 250 L186 270 L186 240 Z" fill="#DFA92C"/>
