<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Place your bid · CargoBid</title>
  <meta name="description" content="Place your bid on this CargoBid load. Reached from your SMS invite — no login needed.">
  <meta name="theme-color" content="#F4F6FD">
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/app.css">
  <style>
    /* Public, session-free page: a branded bar + one centred column.
       Deliberately NOT the sidebar app shell — this is the SMS landing. */
    .pub-bar {
      position: sticky; top: 0; z-index: 50;
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
      min-height: 4.5rem; padding: 0.75rem clamp(1.25rem, 4vw, 2.5rem);
      background: rgba(244, 246, 253, 0.82);
      backdrop-filter: saturate(180%) blur(12px);
      -webkit-backdrop-filter: saturate(180%) blur(12px);
      border-bottom: 1px solid var(--line);
    }
    .pub-bar-tag { display: inline-flex; align-items: center; gap: 0.4375rem; font: 500 0.8125rem/1 var(--font-sans); color: var(--ink-2); }
    .pub-bar-tag i { color: var(--ok); font-size: 1rem; }
    .pub-wrap { width: min(640px, calc(100vw - 2.5rem)); margin: 0 auto; padding: clamp(1.5rem, 4vw, 2.75rem) 0 5rem; }
    .pub-head { margin-bottom: var(--s-5); }
    .bid-block { margin-top: var(--s-4); }
    .linklike { background: none; border: 0; padding: 0; color: var(--accent-deep); font: 550 0.8125rem/1.5 var(--font-sans); cursor: pointer; }
    .linklike:hover { text-decoration: underline; }
    @media (max-width: 480px) { .pub-bar-tag span { display: none; } }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="grain" aria-hidden="true"></div>

  <header class="pub-bar">
    <div id="brand"></div>
    <span class="pub-bar-tag"><i class="ri-shield-check-line"></i><span>Secure bid link</span></span>
  </header>

  <main class="pub-wrap" id="main" aria-live="polite"></main>

  <script src="assets/js/core.js"></script>
  <script src="assets/js/match.js"></script>
  <script src="assets/js/seed.js"></script>
  <script src="assets/js/sim.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/console.js"></script>
  <script>
  (function () {
    'use strict';
    CB.boot();

    var dom = CB.dom, esc = CB.util.esc, f = CB.fmt, q = CB.q, ui = CB.ui, act = CB.act, match = CB.match;

    document.getElementById('brand').innerHTML = CB.ui.logo('index.html');

    var main = document.getElementById('main');
    var loadId = CB.param('load');
    var token = CB.param('t');
    /* The magic link carries no session — the token reverse-maps to a carrier. */
    var transporterId = (loadId && token) ? CB.seed.resolveToken(loadId, token) : null;

    /* What we last painted, so a live 'change' can repaint minimally without
       clobbering a half-typed form. */
    var last = { status: null, placed: false };

    function safe(fn, d) { try { var v = fn(); return v == null ? d : v; } catch (e) { return d; } }

    /* ---- delegated wiring (bound once; survives innerHTML swaps) ---------- */
    dom.on(main, 'input', '#cb-amt', updateHint);
    dom.on(main, 'click', '#cb-submit', onSubmit);
    dom.on(main, 'click', '.js-signin-dash', function () {
      CB.auth.signIn(transporterId);
      window.location.href = CB.handoff.tag(CB.rel(CB.auth.home('transporter')), transporterId);
    });
    dom.on(main, 'click', '.js-signin-load', function () {
      CB.auth.signIn(transporterId);
      window.location.href = CB.handoff.tag(
        CB.rel('transporter/load.html?id=' + encodeURIComponent(loadId)), transporterId);
    });

    CB.on('change', onChange);

    /* ---- live repaint ---------------------------------------------------- */
    function onChange() {
      if (last.placed) return;                 // success is terminal
      var l = q.load(loadId);
      if (!l) return;
      if (l.status !== last.status) { render(); return; }   // state flipped → full redraw
      if (l.status === 'open') paintAuction(l);             // else just refresh the live strip
    }

    function paintAuction(l) {
      var el = document.getElementById('cb-auction');
      if (!el) return;
      el.innerHTML = auctionRegion(l);
      ui.startCountdowns();
    }

    /* ---- pieces ---------------------------------------------------------- */
    function greeting(card) {
      var first = (card.name || 'there').split(' ')[0];
      return '<div class="pub-head">' +
        '<p class="t-eyebrow">Secure bid link · ' + esc(loadId) + '</p>' +
        '<h1 class="t-h2" style="margin-top:.35rem">Hi ' + esc(first) + ', you’re invited to bid</h1>' +
        '<div class="row" style="gap:.6rem;align-items:center;margin-top:.7rem;flex-wrap:wrap">' +
          CB.ui.avatar(card.name || 'Carrier', transporterId, 'sm') +
          '<span style="font-weight:600">' + esc(card.company || card.name || 'Your account') + '</span>' +
          (card.verified ? CB.ui.verifiedBadge(true, true) : '') +
          (card.reliability != null ? '<span class="chip chip-xs"><i class="ri-shield-check-line"></i>' + card.reliability + ' reliability</span>' : '') +
        '</div>' +
      '</div>';
    }

    function auctionRegion(l) {
      if (l.mode === 'blind') {
        return '<div class="notice notice-info"><i class="ri-eye-off-line"></i><div>' +
          '<strong>Sealed auction.</strong> Rivals can’t see your number and you can’t see theirs — bid your sharpest rate.</div></div>';
      }
      var lowest = q.lowestBid(l.id);
      var bids = q.liveBidsFor(l.id);
      return '<div class="auction-bar">' +
        '<span class="pulse" aria-hidden="true"></span>' +
        '<div><div class="auction-label">Bidding open</div>' + ui.countdown(l.bidCloseAt, 'Closes in ') + '</div>' +
        '<div class="auction-sep"></div>' +
        '<div><div class="auction-label">Bids</div><strong style="font-size:1.125rem">' + bids.length + '</strong></div>' +
        (lowest ? '<div class="auction-sep"></div><div><div class="auction-label">Leading</div>' +
          '<strong class="t-num" style="font-size:1.125rem">' + f.money(lowest.amount) + '</strong></div>' : '') +
      '</div>';
    }

    function summaryCard(l) {
      var tt = CB.truckType(l.need.truckType);
      var flagChips = ui.flagChips(l.material.flags);
      return '<div class="card bid-block"><h3 style="font-size:1rem;margin-bottom:.85rem">' + ui.route(l) + '</h3>' +
        ui.kv([
          ['Material', esc(l.material.name) + ' · ' + f.tons(l.material.weightTons)],
          l.material.dims ? ['Dimensions', esc(l.material.dims)] : null,
          flagChips ? ['Handling', flagChips] : null,
          ['Truck', tt.label + (l.need.count > 1 ? ' × ' + l.need.count : '')],
          ['Min capacity', f.tons(l.need.minCapacityTons)],
          ['Distance', f.km(l.distanceKm)],
          ['Pickup', f.day(l.pickup.from) + ', ' + f.time(l.pickup.from) +
            (l.pickup.flexible ? ' <span class="chip chip-xs">±' + l.pickup.flexDays + 'd</span>' : '')],
          l.deliverBy ? ['Deliver by', f.day(l.deliverBy) + ', ' + f.time(l.deliverBy)] : null,
          ['Auction', l.mode === 'blind' ? 'Sealed bids' : 'Open (reverse)'],
          l.ceiling ? ['Ceiling', f.money(l.ceiling)] : null,
          ['Pickup point', esc(l.origin.address || l.origin.city) + (l.origin.pincode ? ' · ' + esc(l.origin.pincode) : '')],
          ['Drop point', esc(l.destination.address || l.destination.city) + (l.destination.pincode ? ' · ' + esc(l.destination.pincode) : '')]
        ]) +
      '</div>';
    }

    function footerLinks() {
      return '<p class="t-small" style="text-align:center;margin-top:2rem;display:flex;gap:1.25rem;justify-content:center;flex-wrap:wrap">' +
        '<button type="button" class="linklike js-signin-dash">Open the full CargoBid dashboard →</button>' +
        '<a href="index.html" style="color:var(--ink-3)">Back to home</a>' +
      '</p>';
    }

    function updateHint() {
      var amtEl = document.getElementById('cb-amt'), hintEl = document.getElementById('cb-hint');
      if (!amtEl || !hintEl) return;
      var l = q.load(loadId);
      if (!l) return;
      var floor = safe(function () { return match.floorPrice(l, transporterId); }, 0);
      var v = Number(amtEl.value) || 0;
      var per = (v && l.distanceKm) ? ' · ' + f.perKm(v, l.distanceKm) : '';
      var floorBit = floor ? ' · <span' + (v && v < floor ? ' style="color:var(--stop)"' : '') + '>walk-away ≈ ' + f.money(floor) + '</span>' : '';
      hintEl.innerHTML = (v ? f.money(v) + per : 'Enter your rate') + floorBit;
    }

    /* ==================================================================== */
    function renderInvalid(reason) {
      last.status = null;
      var msg = reason === 'load'
        ? 'The load this link points to isn’t in this browser anymore. It may have been cleared, or the demo was reset.'
        : 'This link is missing part of its code or has expired. Ask the shipper to resend it, or sign in to find the load.';
      main.innerHTML =
        '<div class="card" style="margin-top:1rem">' +
          ui.empty('ri-link-unlink', 'This bid link isn’t valid', msg,
            '<div class="row" style="gap:.5rem;justify-content:center;flex-wrap:wrap;margin-top:1.25rem">' +
              '<a class="btn" href="login.html"><i class="ri-login-box-line"></i>Sign in to CargoBid</a>' +
              '<a class="btn btn-outline" href="index.html">Back to home</a>' +
            '</div>') +
        '</div>';
    }

    function renderClosed(l, card) {
      last.status = l.status;
      var msg = l.status === 'closed'
        ? 'The shipper is choosing a carrier now — if you win, you’ll get a text.'
        : l.status === 'cancelled'
          ? 'The shipper cancelled this load.'
          : 'This load has already been awarded to a carrier.';
      main.innerHTML =
        greeting(card) +
        '<div class="notice notice-warn"><i class="ri-lock-2-line"></i><div><strong>Bidding has closed.</strong> ' + msg + '</div></div>' +
        summaryCard(l) +
        footerLinks();
    }

    function renderOpen(l, card) {
      last.status = l.status;
      var eligible = safe(function () { return match.eligibleTrucks(transporterId, l); }, []) || [];
      var existing = q.myBidOn(l.id, transporterId);
      var guide = match.priceGuide(l);
      var lowest = q.lowestBid(l.id);
      var floor = safe(function () { return match.floorPrice(l, transporterId); }, 0);
      var suggest = existing ? existing.amount
        : (l.mode !== 'blind' && lowest ? Math.max(lowest.amount - 50, floor || 500, 500) : guide.base);

      var truckField = eligible.length
        ? '<div class="field"><label for="cb-truck">Truck to commit</label><select id="cb-truck" class="select">' +
            eligible.map(function (tk) {
              var tt = CB.truckType(tk.type);
              return '<option value="' + tk.id + '">' + esc(tk.regNo) + ' · ' + esc(tt.label) + ' · ' + f.tons(tk.capacityTons) +
                (tk.status === 'idle' ? ' · idle' : '') + '</option>';
            }).join('') +
          '</select></div>'
        : '<div class="notice notice-info"><i class="ri-truck-line"></i><div>No matching truck is registered on your account yet — place the bid now and confirm the vehicle from your dashboard.</div></div>';

      var formHtml =
        (l.mode !== 'blind' && lowest
          ? '<div class="notice notice-info" style="margin-bottom:.75rem"><i class="ri-flag-2-line"></i><div>Leading bid is <strong>' + f.money(lowest.amount) + '</strong>. Come in under it to take the lead.</div></div>'
          : (l.mode === 'blind'
            ? '<div class="notice notice-info" style="margin-bottom:.75rem"><i class="ri-eye-off-line"></i><div>Sealed auction — the shipper weighs your price against your reliability.</div></div>'
            : '')) +
        '<div class="field"><label for="cb-amt">Your rate (₹)</label>' +
          '<input id="cb-amt" class="input" type="number" min="500" step="50" inputmode="numeric" value="' + suggest + '"></div>' +
        '<p class="t-small" id="cb-hint"></p>' +
        truckField +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem">' +
          '<div class="field"><label for="cb-eta">Pickup ETA</label><select id="cb-eta" class="select">' +
            '<option value="2">Within 2 hours</option><option value="4">Within 4 hours</option>' +
            '<option value="6" selected>Within 6 hours</option><option value="12">Within 12 hours</option>' +
            '<option value="24">Next day</option><option value="48">In 2 days</option></select></div>' +
          '<div class="field"><label for="cb-valid">Hold rate for</label><select id="cb-valid" class="select">' +
            '<option value="6">6 hours</option><option value="12">12 hours</option>' +
            '<option value="24" selected>24 hours</option><option value="48">48 hours</option></select></div>' +
        '</div>' +
        '<div class="field"><label for="cb-note">Note to shipper <span class="t-small">· optional</span></label>' +
          '<textarea id="cb-note" class="textarea" rows="2" maxlength="200" placeholder="e.g. Tarpaulin and ropes included, can load tonight.">' +
            (existing && existing.note ? esc(existing.note) : '') + '</textarea></div>' +
        '<button type="button" class="btn btn-block" id="cb-submit" style="margin-top:.25rem">' +
          '<i class="ri-price-tag-3-line"></i>' + (existing ? 'Update bid' : 'Place bid') + '</button>';

      main.innerHTML =
        greeting(card) +
        '<div id="cb-auction">' + auctionRegion(l) + '</div>' +
        '<div class="card bid-block">' +
          '<div class="row-between" style="align-items:center;margin-bottom:.85rem">' +
            '<h3 style="font-size:1rem">' + (existing ? 'Update your bid' : 'Place your bid') + '</h3>' +
            (existing ? '<span class="chip chip-xs chip-accent">Current · ' + f.money(existing.amount) + '</span>' : '') +
          '</div>' +
          formHtml +
        '</div>' +
        summaryCard(l) +
        footerLinks();

      /* prefill from an existing bid, then compute the live hint */
      if (existing) {
        var es = document.getElementById('cb-eta');
        if (es && existing.etaPickupHrs) es.value = String(existing.etaPickupHrs);
        var ts = document.getElementById('cb-truck');
        if (ts && existing.truckId) ts.value = existing.truckId;
      }
      updateHint();
      ui.startCountdowns();
    }

    function renderSuccess(l, amount, card) {
      last.placed = true;
      main.innerHTML =
        '<div class="card" style="text-align:center;padding:2.5rem 1.5rem;margin-top:1rem">' +
          '<div style="font-size:2.75rem;line-height:1;color:var(--ok)"><i class="ri-checkbox-circle-fill"></i></div>' +
          '<h2 class="t-h3" style="margin-top:.85rem">Bid placed · ' + f.money(amount) + '</h2>' +
          '<p class="t-body" style="margin-top:.6rem">We’ll text you the moment the shipper decides. You can keep your number sharp — reopen this link to update it any time the auction is live.</p>' +
          '<div class="row" style="gap:.5rem;justify-content:center;flex-wrap:wrap;margin-top:1.5rem">' +
            '<button type="button" class="btn js-signin-dash"><i class="ri-dashboard-line"></i>Open full dashboard</button>' +
            '<button type="button" class="btn btn-outline js-signin-load"><i class="ri-eye-line"></i>Track this load</button>' +
          '</div>' +
          '<p class="t-small" style="margin-top:1.1rem">Signed in as ' + esc(card.company || card.name || 'your account') + '</p>' +
        '</div>' +
        summaryCard(l);
    }

    function onSubmit() {
      var l = q.load(loadId);
      if (!l || l.status !== 'open') { CB.toast('Bidding has closed for this load', 'warn'); render(); return; }
      var amtEl = document.getElementById('cb-amt');
      var amount = Math.round(Number(amtEl.value));
      if (!(amount > 0)) { ui.setError(amtEl, 'Enter a valid rate'); return; }
      if (l.ceiling && amount > l.ceiling) { ui.setError(amtEl, 'Above the shipper’s ceiling of ' + f.money(l.ceiling)); return; }

      var truckSel = document.getElementById('cb-truck');
      var truckId = truckSel ? truckSel.value : null;
      var tk = truckId ? q.truck(truckId) : null;
      var etaEl = document.getElementById('cb-eta');
      var validEl = document.getElementById('cb-valid');
      var noteEl = document.getElementById('cb-note');

      var r = act.placeBid({
        loadId: l.id, transporterId: transporterId, amount: amount,
        etaPickupHrs: Number(etaEl && etaEl.value) || 6,
        truckId: truckId || null,
        truckType: tk ? tk.type : l.need.truckType,
        note: ((noteEl && noteEl.value) || '').trim(),
        validHrs: Number(validEl && validEl.value) || 24
      });
      if (!r || r.error) { ui.setError(amtEl, (r && r.error) || 'Could not place the bid'); return; }

      var card = q.transporterCard(transporterId) || {};
      renderSuccess(l, amount, card);
      CB.toast('Bid placed · ' + f.money(amount), 'ok');
    }

    /* ==================================================================== */
    function render() {
      if (!loadId || !token) { renderInvalid('link'); return; }
      if (!transporterId) { renderInvalid('link'); return; }
      var l = q.load(loadId);
      if (!l) { renderInvalid('load'); return; }
      var card = q.transporterCard(transporterId) || {};
      if (l.status === 'open') { renderOpen(l, card); return; }
      renderClosed(l, card);
    }

    render();
  }());
  </script>
</body>
</html>
